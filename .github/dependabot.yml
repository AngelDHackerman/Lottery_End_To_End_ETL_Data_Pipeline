# PR-053. Version and security updates, so a CVE in a dependency reaches us as a PR instead
# of as a news item. The 2026-10-24 audit found urllib3 CVE-2026-97689 by reading the news;
# the deployed layer was safe only because PR-046's lock happened to pin the fixed release.
#
# PR-053.1 narrowed it to what something actually installs. The first run (2026-10-25) opened
# 11 PRs at once and most of them proposed changes nothing would consume, or production
# changes a bot cannot make. At most one pip PR and one Actions PR a week now.
version: 2
updates:
  # Every `uses:` is pinned to a commit SHA with its version in a comment (PR-053), so a tag
  # moved by whoever controls the action's repository cannot change what runs here. Dependabot
  # reads the comment and proposes the new SHA together with the new version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # One entry for the whole repository: "/" already scans requirements/*.txt as well as
  # pyproject.toml. A second entry for "/requirements" (PR-053) proposed every bump twice.
  #
  # What is left is requirements/extractor.txt — the input of the Lambda layer's lock — and
  # it arrives red BY DESIGN: CI's "lock is in sync" check fails until someone runs
  # `make lock` on the PR branch and commits requirements/extractor.lock (PR-046). Dependabot
  # does not regenerate that lock, so that half stays manual.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Records, not installs. Nothing builds from glue.txt: it lists what the Glue Python Shell
    # 3.9 runtime ships, so a bump there would describe a runtime we do not have. dq.txt's GX
    # pin mirrors the Terraform variable the DQ job installs from, and its pandas/pyarrow are
    # what Glue 5.0 ships. Bumping either file would make it lie.
    exclude-paths:
      - "requirements/glue.txt"
      - "requirements/dq.txt"
    ignore:
      # A GX upgrade is a planned production change, not a bot's PR: the three pins together
      # (pyproject's dq and dev extras, dq.txt), `make dq-sync` to regenerate the committed
      # suites under qa/great_expectations/, and `great_expectations_version` in Terraform
      # with its apply. Dependabot can do only the first of the four.
      - dependency-name: "great-expectations"
    groups:
      pip:
        patterns: ["*"]
