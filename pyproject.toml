[project]
name = "loteria-santa-lucia"
version = "0.1.0"
description = "Serverless data pipeline for the Loteria Santa Lucia de Guatemala (medallion architecture on AWS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Angel Hernandez" }]
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "pyarrow",
    "python-dateutil",
    "boto3",
]

[project.optional-dependencies]
# PR-032. Kept OUT of [project.dependencies] on purpose: great-expectations pulls in scipy,
# altair and pydantic, and none of that belongs in the Lambda layer or the Glue transformer
# zip, which are built by copying src/loteria into an archive. Only the DQ job needs it.
#
# ⚠️ PR-033 PLANNING NOTE: great-expectations 1.x requires Python >= 3.10, and Glue Python
# Shell supports only 3.6 and 3.9 (PR-020's spike). The roadmap's "a Python Shell job that
# pip-installs great-expectations" therefore cannot work as written — pip would resolve back
# to the 0.18 line, whose API is incompatible with everything in src/loteria/dq. PR-033 has
# to pick a runtime that is 3.10+.
#
# ⚠️ PINNED, not floated, and PR-034's first CI run is why. The committed suite JSON under
# qa/great_expectations/ records the GX version that produced it, and
# tests/unit/test_dq_suites.py asserts the committed file still matches the Python builders.
# With `>=1.0,<2.0` here, CI installed whatever PyPI had that morning (1.23.0) while the
# committed suites and every developer machine were on 1.20.0 — so the test failed on a
# clean runner with no code change, and would have kept failing at random on every future
# GX release. requirements/dq.txt (what the Glue job actually installs) was already pinned
# to 1.20.0; these now match it, so CI validates the same GX that production runs.
#
# Bumping GX is therefore a deliberate, reviewable act: change all three pins together and
# run `make dq-sync` to regenerate the committed suites. The test failing on an un-synced
# bump is the test doing its job.
dq = ["great-expectations==1.20.0"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "moto",
    "great-expectations==1.20.0",  # keep in step with the "dq" extra and requirements/dq.txt
    "nbstripout",
    "pre-commit",
]

[tool.uv]
# PR-016 landed the src/loteria layout, but the deployment artifacts are zips built by
# scripts/build_{lambda,glue}_package.sh (which copy src/loteria into the zip root) — the
# package is never pip-installed into Lambda or Glue. So there is still nothing to build:
# this stays a dependency manifest, and tests import `loteria` via tool.pytest pythonpath.
package = false
# Dev dependencies are declared via the PEP 621 optional-dependencies "dev" group above.
# Install with: uv sync --extra dev

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

# PR-034. Until CI existed, ruff only ever ran through pre-commit — which passes it the
# CHANGED files, so nothing here had been linted in full. `ruff check .` over the repo
# reports 39 errors and `ruff format --check .` wants to reformat 8 files, every one of them
# in the two directories below and none in src/, tests/ or scripts/.
#
# They are excluded rather than fixed, because neither ships:
#   - notebooks/ is exploratory EDA. Reformatting a notebook rewrites its JSON wholesale for
#     no benefit, and its hygiene is already nbstripout's job (see .pre-commit-config.yaml).
#     E501 on a matplotlib call in a scratch cell is not a defect.
#   - miscellaneous/ is one-off scripts kept for reference (a CSV downloader, an image
#     converter, an XPath probe). Nothing imports them and nothing deploys them.
#
# The point is that `ruff check .` now means something: it covers exactly the code that runs
# in AWS. A lint job that is red on arrival teaches everyone to ignore the lint job.
extend-exclude = ["notebooks", "miscellaneous"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["loteria"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed (see [tool.uv] above), so put src/ on sys.path for tests.
pythonpath = ["src"]

# PR-029.
#
# ⚠️ The roadmap asked for `--cov-fail-under=98` here. That is NOT reachable at this point in
# the plan and setting it would ship a gate that fails on the very PR that introduces it —
# which teaches everyone to run `pytest --no-cov`, and then the gate protects nothing.
# The arithmetic: src/loteria is 502 statements. PR-029 covers parser.py (59) = 11.8%.
# PR-030 adds transformer.py (111) = 33.9%. PR-031's scraper test is skipped by default and
# adds 0. Reaching 70% needs the extractor, s3_utils, aws_secrets, purge_and_load and
# object_count tested too — work that belongs to PR-035, which already says "add tests as
# needed to clear the bar".
#
# So the number below is a RATCHET, not a target: it sits at whatever the suite currently
# achieves, which makes it a regression guard. Raise it in the same PR that adds the tests.
# History: PR-029 11 (actual 11.75). PR-030 42 (actual 42.23 — beat the 33.9% estimate
# because moto exercises s3_utils to 73% and aws_secrets to 45% as a side effect of the
# transformer running for real). PR-032 56 (actual 56.11 — src/loteria/dq lands at 100%,
# and its end-to-end test drives the transformer again, which pushes logging_setup to 97%).
# PR-033 67 (actual 67.13 — the gate tests cover glue_entrypoint.py to 98% and, by moving
# format_report/summarize_failures out of scripts/run_dq.py and into the library, take
# dq/runner.py from 58% to 100%: code in scripts/ is not measured, so the move converted
# untracked lines into tracked and tested ones).
# PR-033.1 69 (actual 69.97 — cloudwatch_logging.py at 97%, most of it the two properties
# that keep a logging failure from failing a data-quality run).
# PR-033.2 70 (actual 70.25 — the re-entrancy tests. A reminder that the ratchet measures
# lines, not truth: cloudwatch_logging.py was already at 97% while the handler silently wrote
# nothing in prod, because every test fed it a client that never logged).
# PR-035 98 (actual 98.52 — the four modules that had never been executed by a test:
# extractor/scraping.py's orchestration, lambda_handler.py, gold/purge_and_load.py and
# observability/object_count.py).
#
# The gate is 98, not the roadmap's 85. The convention above is that the number sits at what
# the suite ACHIEVES — an 85 gate on a 98.52 suite leaves 13 points of silent regression
# room, which is the opposite of a ratchet. 85 was a floor, and it is met.
#
# The 12 statements still uncovered are dead ends, each deliberate:
#   transformer/__main__.py (3)      the real Glue entry point is scripts/glue_zip_main.py,
#                                    which imports main() directly; this module is inert
#                                    (PR-016).
#   transformer.py 204-206           the `else` filling the reintegro columns when the
#                                    column is absent. process_header is its only producer
#                                    and raises on a header without REINTEGROS, so the
#                                    branch cannot be reached from the pipeline — see
#                                    test_transformer.py's rejection test, which pins the
#                                    behaviour that IS reachable.
#   transformer.py 338 · glue_entrypoint.py 161    `if __name__ == "__main__"` guards.
#   scraping.py 222-223              the `except (ValueError, IndexError)` fallback to
#                                    year="unknown". Unreachable today because the date
#                                    regex is unanchored and matches a prefix instead of
#                                    failing — the defect documented in
#                                    test_extract_lottery_data.py and filed in roadmap.md.
#   cloudwatch_logging.py 158        the empty-batch guard, kept as belt and braces for a
#                                    caller that flushes by hand (PR-033.2).
#   purge_and_load.py 91             `if not batch: continue` inside a range() loop whose
#                                    slices are never empty.
#
# Everything on that list is either a defect's shadow or a deliberate guard. None of it is
# untested behaviour, which is the distinction a percentage cannot make on its own.
#
# Coverage is measured over ALL of src/loteria, deliberately. Scoping --cov to only the
# tested modules would show a flattering number that hides the untested majority, which is
# the opposite of what a repo about data quality should do.
addopts = "-ra --strict-markers --cov=src/loteria --cov-report=term-missing --cov-fail-under=98"

markers = [
    # PR-031: hits the real loteria.org.gt through scrape.do. Deselected by default (see
    # tests/conftest.py) because it costs a third-party proxy request, needs a token, and
    # fails when the site is behind its Cloudflare waiting room — none of which should break
    # a local run or a PR build. The weekly canary workflow opts in with RUN_LIVE_SCRAPER=1.
    "integration: talks to a real external service; requires RUN_LIVE_SCRAPER=1",
]
